server:
  port: 8080

spring:
  application:
    name: maidattendance
  profiles:
    active: dev
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

---
# Development Profile (H2 In-Memory with MySQL compatibility mode)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:maidattendance;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

---
# Production Profile ($0 Cloud Hosting: TiDB / Aiven / Oracle Cloud MySQL)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/maidattendance?useSSL=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false

---
# App specific configurations
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
    enabled: ${FIREBASE_ENABLED:false} # Mock mode fallback when service-account JSON is not provided
  geofence:
    default-radius-meters: 50
    default-dwell-time-minutes: 3

# Swagger / OpenAPI documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
